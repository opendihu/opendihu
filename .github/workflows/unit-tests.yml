name: unit-tests
on: [push, pull_request]
jobs:
  container-test-job:
    runs-on: ubuntu-latest
    container: carmehp/opendihu:latest
    steps:
      - name: Show path
        run: pwd
      - name: Show content
        run: ls
      - name: Build 
        working-directory: opendihu
        run: python3 dependencies/scons/scons.py BUILD_TYPE=RELEASE no_examples=TRUE

